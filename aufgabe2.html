	<!-- Die Canvas-Info-Box -->
<div style="margin: 20px auto; text-align: center;">
    <h2>WebGL Prototyp</h2>
  
     <canvas id="fanCanvas"width="600px" height="270px"></canvas>
 <div class="controls">
        <label for="sizeSlider">Fächer öffnen/schließen:</label>
        <input type="range" id="sizeSlider" min="0" max="180" value="180">
    </div>
 
    <script>
        const canvas = document.getElementById('fanCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('sizeSlider');

        // Feste Parameter
        const centerX = canvas.width / 2;
        const centerY = canvas.height;
        const radius = 250;
        const totalTriangles = 29;

        function drawFan() {
            // Leinwand leeren
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Aktuellen Winkel aus dem Slider auslesen (in Bogenmaß umrechnen)
            const currentSpread = (slider.value * Math.PI) / 180;

            // Die Mitte des Fächers zeigt strikt nach oben (1.5 * PI bzw. 270 Grad)
            const centerAngle = 1.5 * Math.PI;
            
            // Start- und Endwinkel bewegen sich symmetrisch von der Mitte weg
            const startAngle = centerAngle - (currentSpread / 2);
            const endAngle = centerAngle + (currentSpread / 2);

            // 1. Array für die 30 Vertices (Eckpunkte) generieren
            const vertices = [];
            vertices.push({ x: centerX, y: centerY }); // Index 0: Zentrum

            // Die restlichen Vertices berechnen
            for (let i = 0; i < totalTriangles; i++) {
                // Verhindert Division durch 0, falls der Fächer komplett geschlossen (0 Grad) ist
                const ratio = totalTriangles > 1 ? i / (totalTriangles - 1) : 0;
                const angle = startAngle + ratio * (endAngle - startAngle);
                
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                vertices.push({ x: x, y: y });
            }

            // 2. Die 29 Dreiecke zeichnen
            for (let i = 1; i <= totalTriangles; i++) {
                const v0 = vertices[0];
                const v1 = vertices[i];
                const v2 = vertices[i + 1];

                if (i === totalTriangles) break; 

                ctx.beginPath();
                ctx.moveTo(v0.x, v0.y);
                ctx.lineTo(v1.x, v1.y);
                ctx.lineTo(v2.x, v2.y);
                ctx.closePath();

                // Alternierende Farben
                ctx.fillStyle = (i % 2 === 0) ? '#ff6600' : '#000000';
                ctx.fill();

                // Feine Trennlinie für saubere Kanten
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        // Event-Listener reagiert sofort auf jede Bewegung des Sliders
        slider.addEventListener('input', drawFan);

        // Erstes Zeichnen beim Laden der Seite
        drawFan();
    </script>
