	<!-- Die Canvas-Info-Box -->
<div style="margin: 20px auto; text-align: center;">
    <h2>WebGL Prototyp</h2>
  
     <canvas id="2dreiecke-oragnge" width="400" height="400"></canvas>

  <script>
        const canvas = document.getElementById('2dreiecke-oragnge');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            alert('WebGL2 wird von Ihrem Browser nicht unterstützt!');
        }

        // 1. Vertex Shader (Positionierung der Punkte)
        const vsSource = `#version 300 es
            in vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        // 2. Fragment Shader (Farbe: Orange R=1.0, G=0.5, B=0.0)
        const fsSource = `#version 300 es
            precision highp float;
            out vec4 outColor;
            void main() {
                outColor = vec4(1.0, 0.5, 0.0, 1.0);
            }
        `;

        // Shader kompilieren und verknüpfen Helper
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(gl.getProgramProgramLog(program));
        }

        // 3. Geometrie (4 Punkte ergeben 2 Dreiecke mit geteilter Kante)
        // Punkt A und B werden von beiden Dreiecken geteilt.
        // Dreieck 1: A, B, C | Dreieck 2: A, B, D
        const vertices = new Float32Array([
            // Geteilte Kante (Punkt A und B)
            0.0,  0.5,  // Punkt A (oben Mitte)
            0.0, -0.5,  // Punkt B (unten Mitte)
            
            // Punkt C (für Dreieck 1 - links)
           -0.6,  0.0,  // Punkt C
           
            // Punkt D (für Dreieck 2 - rechts oben versetzt, verhindert ein Viereck)
            0.6,  0.7   // Punkt D
        ]);

        // Indizes, wie die Punkte zu Dreiecken verbunden werden
        const indices = new Uint16Array([
            0, 1, 2, // Erstes Dreieck: A, B, C
            0, 1, 3  // Zweites Dreieck: A, B, D
        ]);

        // Buffers erstellen und mit Daten füllen
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const positionAttributeLocation = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(positionAttributeLocation);
        gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

        // 4. Zeichnen (Render Loop)
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(program);
        gl.bindVertexArray(vao);

        // 6 Indizes zeichnen (2 Dreiecke * 3 Punkte)
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    </script>
