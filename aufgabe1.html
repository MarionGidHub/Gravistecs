<!DOCTYPE html> 
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Interaktiv animierter Kürbis</title>
	<style>
		body { 
			font-family: Arial, sans-serif; 
			text-align: center; 
			margin-top: 45px; 
			background-color: #000;
			color: #ffffff;
		}

		h1 {
			color: #F28500;
			/*font-family: 'gondala';
			//src: url('fonts/gondala/Gondola_SD-webfont.ttf)
  //font-weight: normal;
  //font-style: normal;
  //font-display: swap;*/
		}
		p {color: #F28500;
			
		}

		/* --- Rahmen um den Kürbis --- */
		.neuer-rahmen {
			position: relative;
			display: inline-block;
			padding: 30px;
			margin: 20px auto;
		}

		.ecke {
			position: absolute;
			width: 30px;
			height: 30px;
			z-index: 2;
		}
		
		.top-left     { top: 0; left: 0; }
		.top-right    { top: 0; right: 0; transform: rotate(90deg); }
		.bottom-right { bottom: 0; right: 0; transform: rotate(180deg); }
		.bottom-left  { bottom: 0; left: 0; transform: rotate(270deg); }

		.kante {
			position: absolute;
			z-index: 1;
		}
		.kante-top {
			top: 0; left: 30px; right: 30px; height: 30px;
			background: url('Bilder/kante-h.png') repeat-x;
			
		}
		.kante-bottom {
			bottom: -1px; left: 30px; right: 30px; height: 15px;
			background: url('Bilder/kante-h.png') repeat-x;
			
		}
		.kante-left {
			top: 0px; bottom: 0px; left: 0; width: 15px;
			background: url('Bilder/kante.png') repeat-y;
			transform: rotate(180deg);
		}
		.kante-right {
			top: 30px; bottom: 30px; right: 0; width: 15px;
			background: url('Bilder/kante.png') repeat-y;
			transform: rotate(0deg);
		}

		.info-box {
			margin-top: 30px; 
			padding: 15px; 
			border: 1px solid #767676; 
			background-color: #222; 
			color: #000000;
			display: inline-block; 
			text-align: left;
		}

	
		.touch-controls {
			display: flex;
			justify-content: center;
			gap: 15px;
			margin: 25px auto;
		}

		.touch-btn {
			width: 60px;
			height: 60px;
			background-color: #F28500;
			color: #000000;
			border: none;
			border-radius: 12px;
			font-size: 22px;
			font-weight: bold;
			cursor: pointer;
			box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
			user-select: none;
			touch-action: manipulation;
		}

		.touch-btn:active {
			transform: scale(0.95);
			background-color: #666;
		}

	
	</style>
</head>
<body>

	<!-- Die Canvas-Info-Box -->
<div style="margin: 20px auto; text-align: center;">
    <h2>WebGL Prototyp</h2>
    <canvas id="webglCanvas" width="400" height="400" style="background-color: #111; border: 2px solid #F28500;"></canvas>
</div>

</body>
</html>
