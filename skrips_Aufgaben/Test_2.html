<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Beispiel Dreieck als Linien</title>
    <style> 
        #bg-bild { 
            position: absolute;
            top: 00px;
            left: 100px;
            width: 300px;
            height: 300px;
            /* Fallback-Farbe Dunkelgrau, falls das Bild fehlt */ 
            background-image: url('bot.jpg'); 
            background-size: cover;        
            background-position: center;   
        }
        #c {
            position: absolute;
            top: 100px;          
            left: 0; 	     
            overflow: visible;
        }
        body {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div id="bg-bild">
        <canvas id="c" width="100" height="100"></canvas>
    </div>

    <script type="text/javascript">
        // 1. WebGL-Kontext modern und sicher initialisieren
        var canvas = document.getElementById('c');
        var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        
        if (!gl) {
            alert("WebGL wird von deinem Browser nicht unterstützt!");
        } else {
            // Canvas komplett transparent leeren
            gl.clearColor(0.0, 0.0, 0.0, 0.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // 2. SHADER-QUELLCODE DEFINIEREN
            var vsSource = `
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            var fsSource = `
                precision mediump float;
                void main() {
                    gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0); // RGBA: Weiß
                }
            `;

            // 3. SHADER COMPILIEREN & FEHLER PRÜFEN
            var vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, vsSource);
            gl.compileShader(vs);
            if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
                console.error("Fehler im Vertex-Shader:", gl.getShaderInfoLog(vs));
            }

            var fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, fsSource);
            gl.compileShader(fs);
            if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
                console.error("Fehler im Fragment-Shader:", gl.getShaderInfoLog(fs));
            }

            // Programm verknüpfen
            var program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error("Fehler beim Verknüpfen des Shader-Programms:", gl.getProgramInfoLog(program));
            }
            
            gl.useProgram(program);

            // 4. GEOMETRIE (ECKPUNKTE DES DREIECKS) DEFINIEREN
            var vertices = new Float32Array([
                 0.0,  0.6,   // Obere Spitze
                -0.6, -0.4,   // Untere linke Ecke
                 0.6, -0.4    // Untere rechte Ecke
            ]);

            // 5. PUFFER ERSTELLEN UND DATEN AN GRAFIKKARTE SENDEN
            var buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

            var positionLocation = gl.getAttribLocation(program, 'position');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            // 6. DAS DREIECK ALS LINIEN-UMRISS ZEICHNEN
            gl.drawArrays(gl.LINE_LOOP, 0, 3);
        }
    </script>
</body>
</html>
